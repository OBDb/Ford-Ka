generations:
  - name: "First Generation (BE146)"
    start_year: 1996
    end_year: 2008
    description: "The original Ford Ka was a revolutionary small city car designed by Claude Lobo and Chris Svensson, featuring distinctive 'New Edge' styling with unusual circular headlamps. Built on a shortened Mark 3 Ford Fiesta platform (BE146), it was characterized by compact dimensions (approximately 3.6 meters long) and light weight. Powered primarily by a 1.3L Endura-E engine with 60 HP, it emphasized fun handling over straight-line performance. The minimalist interior featured exposed painted metal and unique circular design elements. Body styles included a 3-door hatchback, 2-door convertible (StreetKa built by Pininfarina), and a 3-door van. Special editions like SportKa (2005-2008) added performance variants. Production ended in 2008 after a 12-year run, with over 1.4 million units produced across Spain (Almussafes), Brazil (São Bernardo do Campo), and Italy."

  - name: "Second Generation - European (B420)"
    start_year: 2008
    end_year: 2016
    description: "The European second-generation Ka was developed and built by Fiat in Tychy, Poland, sharing the Fiat 500/Panda platform. Unlike its predecessor, it featured more conventional styling with a 3-door hatchback body style. Engine options included a 1.2L Duratec petrol (69 PS, 102 Nm) and a 1.3L Duratorq diesel (75 PS, 145 Nm), both Fiat-sourced with CO2 emissions under 120 g/km. Interior featured improved materials with optional Bluetooth, USB port, and voice control. The suspension was retuned from the Fiat 500 with a rear antiroll bar for improved ride quality. Ford Individual packages (Tattoo/Grand Prix/Digital) offered customization options. Production ended May 20, 2016."

  - name: "Second Generation - Latin American (B402)"
    start_year: 2008
    end_year: 2013
    description: "The Latin American second-generation Ka was a separate model developed and built in Brazil (São Bernardo do Campo), based on the first-generation Ka chassis with redesigned exterior using Ford's 'Kinetic Design' language. Longer than the European version at 3836mm, it competed in the subcompact class with a redesigned rear seat accommodating five passengers. Engines were 1.0L and 1.6L Zetec Rocam flex-fuel four-cylinder engines. A mid-cycle facelift was introduced in 2011 following the Kinect concept car. Unlike the European version, this model was not sold in Mexico."

  - name: "Third Generation"
    start_year: 2014
    end_year: 2020
    description: "The third-generation Ka was developed by Ford Brazil as a global B-segment model, marketed in Europe as 'Ka+' to distinguish it from previous city car generations. Built on Ford's global B-car platform (shared with Fiesta), it was significantly larger at 3886-3929mm with a 2491mm wheelbase. Available as 5-door hatchback and 4-door sedan (Aspire in India). European models featured a 1.2L Ti-VCT engine (70-85 PS). The range was expanded to include the Ka+ Active crossover variant in 2018 with raised ride height and body cladding. Production in Europe ended September 2019, while Brazilian production continued until January 2021."